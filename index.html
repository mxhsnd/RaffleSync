<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaffleSync 大屏展示</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen overflow-hidden">
  <div class="stage-bg" aria-hidden="true"></div>
  <div class="stage-vignette" aria-hidden="true"></div>

  <main id="displayStage" class="display-stage relative flex min-h-screen flex-col p-8">
    <section id="introScene" class="intro-scene flex min-h-[calc(100vh-4rem)] flex-col items-center justify-start pt-16 text-center">
      <div class="particle-field" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="intro-aura" aria-hidden="true"></div>
      <div class="intro-content">
        <h1 class="intro-title">毕业晚会幸运抽奖</h1>
      </div>
    </section>

    <section id="raffleScene" class="raffle-scene pointer-events-none absolute inset-0 flex flex-col p-8 opacity-0">
      <header class="raffle-header text-center">
        <h1 id="roundTitle" class="text-6xl font-black glow-text"></h1>
        <p id="roundSubtitle" class="mt-4 text-xl text-white/70"></p>
      </header>

      <section id="normalDisplay" class="flex flex-1 flex-col justify-center gap-8 py-8">
        <div id="rollingGrid" class="grid grid-cols-2 gap-4 md:grid-cols-4 xl:grid-cols-6"></div>
        <div id="winnerGrid" class="grid gap-5 md:grid-cols-3 xl:grid-cols-5"></div>
      </section>

      <section id="deanDisplay" class="hidden flex-1 items-center py-8">
        <div id="deanCards" class="grid w-full gap-5 lg:grid-cols-5"></div>
      </section>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="display.js"></script>
</body>
</html>
