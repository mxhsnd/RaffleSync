<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaffleSync 控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen p-6">
  <main class="mx-auto max-w-7xl space-y-6">
    <header class="glass-card p-6 flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.45em] text-amber-200/85">RaffleSync Admin</p>
        <h1 class="text-4xl font-black glow-text">毕业晚会抽奖控制台</h1>
        <p id="statusText" class="mt-2 text-white/70">正在加载活动名单...</p>
      </div>
      <div class="grid grid-cols-2 gap-3 lg:grid-cols-5">
        <button data-round="NORMAL_A" class="round-btn admin-button rounded-xl bg-red-700/35 px-5 py-3 font-bold text-amber-50 border border-amber-200/40">预热活动抽奖</button>
        <button data-round="NORMAL_B" class="round-btn admin-button rounded-xl bg-red-600/35 px-5 py-3 font-bold text-amber-50 border border-amber-200/40">互动抽奖</button>
        <button data-round="DEAN_DRAW" class="round-btn admin-button rounded-xl bg-amber-500/25 px-5 py-3 font-bold text-amber-50 border border-amber-200/30">学院特殊礼物抽奖</button>
        <button id="returnHome" class="admin-button rounded-xl bg-amber-300/20 px-5 py-3 font-bold text-amber-50 border border-amber-200/30">回到主页</button>
        <button id="resetDisplay" class="admin-button rounded-xl bg-rose-500/25 px-5 py-3 font-bold text-rose-50 border border-rose-200/30">清理缓存</button>
      </div>
    </header>

    <section id="normalPanel" class="glass-card p-6 space-y-5">
      <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
        <div>
          <h2 class="text-2xl font-black glow-text">普通抽奖</h2>
          <p class="text-white/60">适用于预热活动抽奖、互动抽奖，从全名单未中奖学生中随机抽取。</p>
        </div>
        <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
          <label class="block">
            <span class="text-sm text-white/70">抽取人数</span>
            <input id="normalCount" type="number" min="1" max="200" value="10" class="mt-2 w-44 rounded-xl border border-white/20 bg-white/10 px-4 py-3 text-xl font-black text-white outline-none focus:border-amber-300">
          </label>
          <label id="interactiveExcludeOption" class="hidden rounded-xl border border-amber-200/20 bg-white/5 px-4 py-3 text-sm text-white/75">
            <input id="interactiveExcludeToggle" type="checkbox" class="mr-2 align-middle accent-amber-400">
            开启后，本次互动中奖人不参与下一次互动抽奖
          </label>
        </div>
      </div>
      <div class="flex flex-wrap gap-3">
        <button id="startNormal" class="admin-button rounded-xl bg-red-600 px-6 py-3 font-black text-amber-50">开始滚动</button>
        <button id="stopNormal" class="admin-button rounded-xl bg-amber-400 px-6 py-3 font-black text-red-950" disabled>开奖</button>
      </div>
      <div id="normalWinners" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4"></div>
    </section>

    <section id="deanPanel" class="glass-card p-6 space-y-5 hidden">
      <div>
        <h2 class="text-2xl font-black gold-text">毕业晚会学院特殊礼物抽奖</h2>
      </div>
      <div class="rounded-xl border border-amber-200/20 bg-white/5 p-4 space-y-3">
        <label class="block text-sm font-bold text-amber-100/85">
          <input id="specifiedDeanToggle" type="checkbox" class="mr-2 align-middle accent-amber-400">
          开启指定下一次学院抽取
        </label>
        <div class="rounded-xl border border-white/10 bg-white/5 p-3 space-y-2">
          <p class="text-sm font-bold text-amber-100/85">快捷填充</p>
          <div class="flex flex-col gap-2 sm:flex-row sm:items-end">
            <label class="block flex-1">
              <span class="text-sm text-white/70">快捷编号</span>
              <input id="specifiedQuickNumber" type="number" min="1" placeholder="请输入编号" class="mt-2 w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3 text-lg font-bold text-white outline-none focus:border-amber-300">
            </label>
            <button id="applySpecifiedQuickPerson" type="button" class="admin-button rounded-xl bg-white/10 px-4 py-3 font-black text-amber-50 border border-white/20">填入指定人员</button>
          </div>
          <p id="specifiedQuickStatus" class="text-sm text-white/55">快捷人员名单加载中，只用于填充姓名和班级。</p>
        </div>
        <div class="grid gap-3 sm:grid-cols-2">
          <label class="block">
            <span class="text-sm text-white/70">指定姓名</span>
            <input id="specifiedDeanName" type="text" placeholder="请输入姓名" class="mt-2 w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3 text-lg font-bold text-white outline-none focus:border-amber-300">
          </label>
          <label class="block">
            <span class="text-sm text-white/70">指定班级</span>
            <input id="specifiedDeanClass" type="text" placeholder="请输入班级" class="mt-2 w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3 text-lg font-bold text-white outline-none focus:border-amber-300">
          </label>
        </div>
        <p id="specifiedDeanStatus" class="text-sm text-white/55">未开启指定抽取，学院特殊礼物抽奖将正常随机。</p>
      </div>
      <div id="deanControls" class="grid gap-4 lg:grid-cols-5"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="control.js"></script>
</body>
</html>
