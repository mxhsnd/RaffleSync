services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:14
    container_name: rafflesync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rafflesync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  backend:
    build:
      context: ./backend
    container_name: rafflesync-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      JWT_SECRET: change_me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rafflesync
    depends_on:
      - postgres
    ports:
      - "13000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: rafflesync-frontend
    restart: unless-stopped
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18080:80"

volumes:
  postgres_data:
